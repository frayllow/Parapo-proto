<!DOCTYPE html>
<html>
<head>
    <title>Driver Side</title>
</head>
<body>
    <h2>Driver GPS Status</h2>
    <div id="status">Waiting for GPS...</div>
    <div id="data-display">Coordinates will appear here.</div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <script>
        // PASTE YOUR CONFIG HERE
        const firebaseConfig = {
            apiKey: "AIzaSyDnfZ2xTSC1oCc2REyjRzQ8f5NAejHtJiI",
            authDomain: "parapo-proto.firebaseapp.com",
            databaseURL: "https://parapo-proto-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "parapo-proto",
            storageBucket: "parapo-proto.firebasestorage.app",
            messagingSenderId: "561177127937",
            appId: "1:561177127937:web:17389e46ae0713c7906400"
        };

        // Initialize
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // Send to Firebase
        function sendLocation(lat, lng) {
            database.ref('drivers/jeep_01').set({
                lat: lat,
                lng: lng,
                lastUpdated: Date.now()
            });
            document.getElementById('data-display').innerText = `Lat: ${lat}, Lng: ${lng}`;
            document.getElementById('status').innerText = "Status: Sending live data...";
        }

        // Get Browser GPS
        if (navigator.geolocation) {
            navigator.geolocation.watchPosition((pos) => {
                sendLocation(pos.coords.latitude, pos.coords.longitude);
            }, (err) => {
                document.getElementById('status').innerText = "Error: GPS Access Denied";
            }, { enableHighAccuracy: true });
        }
    </script>
</body>
</html>
